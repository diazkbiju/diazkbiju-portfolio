<style>
/* VOICE: quiet, photographer's contact sheet, the pictures do the talking
   IDEA: a darkroom wall of prints, each project a pinned set
   PICTURE: the photos themselves, large, edge to edge
   COLOUR and TYPE: near-black wall, warm white ink, signal orange accent from the race shots; Anton + Inter
   LAYOUT: name masthead, 2-up landscape project grid, project page with one full, uncropped, high-res photo after another, and a lightbox */
:root{--rh:280px;color-scheme:light dark;--bg:light-dark(#f3f1ec,#111111);--ink:light-dark(#141413,#f1eee8);--mute:light-dark(#6b6862,#8f8b84);--line:light-dark(#d9d5cc,#24231f);--card:light-dark(#e6e2d9,#181816);--acc:#ff5a1f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{overflow-y:scroll;scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Arial,Helvetica,sans-serif;overflow-x:clip}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:22px 4vw;position:relative;top:0;background:none;z-index:5;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55),0 0 14px rgba(0,0,0,.35);pointer-events:none}
header a{pointer-events:auto}
.logo{white-space:nowrap;font:400 clamp(32px,3.7vw,54px)/1 'Bebas Neue','Bebas Kai','Arial Narrow',sans-serif;letter-spacing:.03em;text-transform:uppercase}
nav{display:flex;gap:4px;justify-self:start}.hsp{justify-self:end}
nav a{padding:8px 10px;font:400 clamp(19px,1.6vw,24px)/1 'Bebas Neue','Bebas Kai','Arial Narrow',sans-serif;letter-spacing:.04em;text-transform:uppercase;color:inherit;opacity:.6;min-height:44px;display:inline-flex;align-items:center}
nav a.on,nav a:hover{opacity:1}
main{padding:clamp(16px,2vw,32px) 4vw 40px}
h1{font:400 clamp(56px,11vw,150px)/.9 'Bebas Neue','Bebas Kai','Arial Narrow',sans-serif;margin:0 0 clamp(24px,4vw,48px);text-transform:uppercase}
h1 span{color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;width:100%}@media(max-width:700px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{display:block;position:relative;overflow:hidden}
.card .ph{aspect-ratio:16/9;width:100%;overflow:hidden;background:var(--card);position:relative}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .4s ease}
.card:hover img,.card:focus-visible img{opacity:.25}
.card .t{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;text-align:center;padding:20px;color:var(--ink);opacity:0;transition:opacity .4s ease;pointer-events:none}
.card:hover .t,.card:focus-visible .t{opacity:1}
.card:hover{background:var(--bg)}
@media(hover:none){.card .t{opacity:1;justify-content:flex-end;background:linear-gradient(transparent 40%,rgba(0,0,0,.7));color:#f4f1ea}.card small{color:rgba(244,241,234,.8)}}
.card h2{text-transform:uppercase;font:400 clamp(22px,2.4vw,34px)/1.1 'Bebas Neue','Bebas Kai','Arial Narrow',sans-serif;margin:0;text-transform:uppercase}
.card small{color:var(--mute);font-size:14px}
.soon{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:14px;text-align:center;padding:20px;background:repeating-linear-gradient(135deg,transparent 0 14px,color-mix(in srgb,var(--line) 60%,transparent) 14px 15px)}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--mute);min-height:44px;margin-bottom:8px}
.back:hover{color:var(--ink)}
.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--mute);margin:-20px 0 32px}
.proj{padding-top:clamp(24px,4vw,64px)}
.proj h1{white-space:nowrap;font:400 clamp(40px,6.7vw,128px)/.95 'Bebas Neue','Bebas Kai','Arial Narrow',sans-serif;margin:0 0 24px;text-transform:uppercase}
.proj .meta{margin:0 0 clamp(24px,3vw,40px);font-size:15px;color:var(--ink);opacity:.85}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.gallery button{all:unset;display:block;cursor:zoom-in;overflow:hidden;background:var(--card)}
.gallery img{display:block;width:100%;height:auto;transition:opacity .35s ease}
.gallery button:hover img{opacity:.75}
.gallery.crop img{aspect-ratio:3/4;object-fit:cover;height:auto}
.gallery.race{grid-template-columns:repeat(6,minmax(0,1fr))}
.gallery.race button{grid-column:span 2}
.gallery.race button.wide{grid-column:span 3}
.gallery button.hero{grid-column:1/-1}
.gallery.nat{display:block;columns:3;column-gap:16px}
.gallery.nat button{break-inside:avoid;margin-bottom:16px;width:100%}
.vid{break-inside:avoid;margin-bottom:16px;background:var(--card)}.vid video{display:block;width:100%;height:auto;aspect-ratio:9/16}
.gallery.nat button.hero{column-span:all}
@media(max-width:56rem){.gallery.nat{columns:2}}
@media(max-width:34rem){.gallery.nat{columns:1}}
.gallery button.hero img{aspect-ratio:16/9;object-fit:cover;height:auto}
@media(max-width:56rem){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:42rem){.gallery.race{grid-template-columns:1fr}.gallery.race button,.gallery.race button.wide{grid-column:auto}}
@media(max-width:34rem){.gallery{grid-template-columns:1fr}.gallery.crop img{aspect-ratio:auto}.gallery button.hero img{aspect-ratio:4/3}}
.empty{border:1px dashed var(--line);padding:48px 24px;text-align:center;color:var(--mute);border-radius:6px}
.contact{max-width:640px;font-size:17px}
.contact p{margin:0 0 18px}
.pager{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:40px;padding-top:20px}
.pager a{min-height:44px;display:inline-flex;align-items:center;color:var(--mute)}
.pager a:hover{color:var(--ink)}
footer{padding:24px 4vw 40px;display:flex;justify-content:space-between;color:var(--mute);font-size:14px;gap:12px;flex-wrap:wrap}
footer a{min-height:44px;display:inline-flex;align-items:center}
#lb{position:fixed;inset:0;background:rgba(6,6,5,.96);display:none;z-index:20;color:#f1eee8}
#lb.open{display:grid;grid-template-rows:auto 1fr;}
#lb .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:14px}
#lb .stage{position:relative;display:grid;place-items:center;padding:0 60px 24px;min-height:0}
#lb img{max-width:100%;max-height:calc(100vh - 90px);object-fit:contain;display:block}
#lb button{background:rgba(255,255,255,.08);color:#f1eee8;border:0;width:48px;height:48px;border-radius:50%;font-size:22px;cursor:pointer}
#lb button:hover{background:rgba(255,255,255,.18)}
#lb .prev,#lb .next{position:absolute;top:50%;transform:translateY(-50%)}
#lb .prev{left:8px}#lb .next{right:8px}
@media(max-width:600px){header{grid-template-columns:auto 1fr;}.hsp{display:none}.logo{justify-self:end;font-size:24px;white-space:nowrap}nav a{font-size:16px;padding:8px 5px}#lb .stage{padding:0 8px 70px}#lb .prev,#lb .next{top:auto;bottom:12px;transform:none}#lb .prev{left:calc(50% - 60px)}#lb .next{right:calc(50% - 60px)}.card .t{flex-direction:column;gap:2px}.card small{text-align:left}}
@media(max-width:700px){:root{--rh:150px}}
@media(prefers-reduced-motion:reduce){.card img{transition:none}}

body.intro{background:#000}
body.intro main{padding-top:0}
body.intro header{position:absolute;left:0;right:0}
#intro{position:relative;height:100vh;height:100svh;margin:0 -4vw clamp(16px,2vw,32px);overflow:hidden;background:#000;touch-action:pan-y;user-select:none}
#intro .deck{position:absolute;inset:0}
#intro .cd{position:absolute;left:29%;top:56%;width:min(30vw,360px);aspect-ratio:4/5;border-radius:4px;overflow:hidden;background:#222;box-shadow:0 18px 40px rgba(0,0,0,.6);transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .7s,filter .7s;cursor:pointer}
#intro .cd img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
#intro .dm{position:absolute;left:47vw;right:5vw;top:50%;z-index:60;color:#fff;display:flex;flex-direction:column;align-items:flex-end;text-align:right}
#intro .dm h1{margin:-.475em 0 0;white-space:nowrap;text-transform:uppercase;font:400 100px/.95 'Bebas Neue','Bebas Kai','Arial Narrow',sans-serif;letter-spacing:.01em}
#intro .dm p{margin:10px 0 0;min-height:1.5em;color:#aaa;white-space:nowrap;font-size:clamp(13px,1.1vw,16px)}
#intro .dm .go{display:inline-flex;align-items:center;min-height:44px;margin-top:14px;color:#fff;border-bottom:1px solid rgba(255,255,255,.5);font:400 20px/1 'Bebas Neue','Arial Narrow',sans-serif;letter-spacing:.06em}
#intro .num{position:absolute;left:5vw;top:50%;transform:translateY(-50%);font:400 clamp(80px,12vw,200px)/1 'Bebas Neue','Arial Narrow',sans-serif;color:#fff;opacity:.12;z-index:1;pointer-events:none}
#intro .arr{position:absolute;right:5vw;bottom:9vh;z-index:61;display:flex;gap:8px}
#intro .arr button{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);color:#fff;display:grid;place-items:center;font-size:18px}
#intro .arr button:hover,#intro .arr button:focus-visible{background:#fff;color:#000}
#intro .hint{position:absolute;z-index:61;left:50%;bottom:22px;transform:translateX(-50%);color:#999;font-size:12px;margin:0;text-align:center;letter-spacing:.06em}
#intro .hint b{display:block;font-weight:400;font-size:18px;line-height:1;margin-top:6px;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
@media(prefers-reduced-motion:reduce){#intro .hint b{animation:none}}
@media(max-width:700px){#intro .cd{left:56%;top:40%;width:52vw}#intro .dm{left:5vw;right:5vw;bottom:19vh;top:auto}#intro .arr{bottom:9vh;right:5vw}#intro .hint{left:5vw;transform:none;text-align:left;bottom:11vh}#intro .num{display:none}}
</style>
</head>
<body>
<header>
  <nav><a href="#work" id="n-work">Work</a><a href="#contact" id="n-contact">Contact</a></nav>
  <a class="logo" href="#" id="top">DIAZ K BIJU</a>
  <span class="hsp"></span>
</header>
<main id="app"></main>
<footer><span>© Diaz K Biju</span><a href="#top" id="totop">Back to top ↑</a></footer>
<div id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="bar"><span id="lbc"></span><button id="lbx" aria-label="Close">×</button></div>
  <div class="stage"><button class="prev" id="lbp" aria-label="Previous">‹</button><img id="lbi" alt=""><button class="next" id="lbn" aria-label="Next">›</button></div>
</div>
<script>
{
// n = number of photos in photos/<slug>/ ; cover = which one shows on the Work grid
const P=[
 {s:'qatar-custom-show-2026',t:'QATAR CUSTOM SHOW 2026',c:'Automotive photography',n:11,cover:5,pos:'50% 80%',g:'nat'},
 {s:'mqube',t:'MQUBE',c:'Concert photography',n:5,cover:1,hero:3,g:'nat'},
 {s:'moto-gp-qatar-2026',t:'MOTO GP QATAR 2026',c:'Motorsport photography',n:13,cover:1,hero:1,g:'race'},
 {s:'auto-shows-2026',t:'AUTO SHOWS 2026',c:'Automotive photography',n:11,cover:4,hero:1,g:'nat'},
 {s:'iyra',t:'IYRA',c:'Hospitality photography',sub:'Photography by Akshaya Ganeshan',n:13,cover:1,flat:1,g:'crop'},
 {s:'mysore-palace',t:'MYSORE PALACE',c:'Travel photography',n:9,cover:1,hero:8,hpos:'50% 50%',g:'nat'},
 {s:'4x4',t:'4×4',c:'Off-road photography',n:20,cover:18,pos:'50% 88%',hero:1,g:'nat'},
 {s:'navy-day-2025',t:'NAVY DAY 2025',c:'Event photography',n:14,cover:2,pos:'50% 53%',hero:14,g:'nat'},
 {s:'g13b',t:'G13b',c:'Automotive photography',n:6,cover:2,pos:'50% 78%',flat:1,g:'crop'},
 {s:'wallpaper-material',t:'Life in Portrait',c:'',n:19,cover:14,pos:'50% 48%',flat:1,g:'nat'}
];
const AR={"4x4":[0.667,0.667,0.667,0.667,0.667,0.667,0.667,0.667,0.75,0.75,0.75,0.75,0.75,0.75,0.75,0.75,0.75,0.75,0.667,0.667],"auto-shows-2026":[1.776,0.757,0.667,1.698,0.667,0.667,0.756,1.493,0.667,0.667,0.667],"g13b":[0.75,0.562,0.75,0.75,0.75,0.562],"iyra":[0.562,0.562,0.562,0.566,0.75,0.562,0.8,0.8,0.8,0.8,0.8,0.8,0.8],"moto-gp-qatar-2026":[1.776,0.562,0.562,0.802,0.562,1.776,0.562,0.562,0.562,0.576,1.0,0.802,0.802],"mqube":[0.707,0.708,1.493,0.757,0.856],"mysore-palace":[0.562,0.562,0.562,0.562,0.75,0.562,1.776,0.562,0.562],"navy-day-2025":[0.572,0.562,0.562,0.698,0.581,0.565,0.568,0.575,0.667,0.667,0.705,0.8,0.667,1.499],"qatar-custom-show-2026":[0.643,0.562,0.562,0.562,0.643,0.562,0.75,0.562,0.75,0.562,0.562],"wallpaper-material":[0.562,0.562,0.562,0.572,0.75,0.562,0.788,0.75,0.75,0.75,0.75,0.574,0.575,0.75,0.75,0.75,0.562,0.562,0.75]};
const app=document.getElementById('app');
const src=(p,i,small)=>`photos/${p.s}/${i}${small?'-s':''}.webp`;
const esc=s=>s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function gridHTML(){
  return `<div class="grid">${P.map(p=>`
    <a class="card" href="#${p.s}"><div class="ph">${p.n?`<img loading="lazy" decoding="async" src="${src(p,p.cover)}" alt="${esc(p.t)}" style="object-position:${p.pos||'50% 55%'}">`:`<div class="soon">Photos coming soon</div>`}</div>
    <div class="t"><h2>${esc(p.t)}</h2>${p.c?`<small>${esc(p.c)}</small>`:''}</div></a>`).join('')}</div>`;
}
function work(){app.innerHTML=gridHTML()}
let cur=null,idx=0;
function project(p){
  const i=P.indexOf(p),prev=P[(i+P.length-1)%P.length],next=P[(i+1)%P.length];
  const ar=AR[p.s]||[];
  let ph=p.ord?p.ord.slice():Array.from({length:p.n},(_,k)=>k+1);
  if(p.g==='race')ph=ph.filter(k=>(ar[k-1]||1)>1).concat(ph.filter(k=>(ar[k-1]||1)<=1));
  if(!p.flat){const h=p.hero||p.cover;ph=[h].concat(ph.filter(k=>k!==h));}
  cur=p;cur.order=ph;
  const sub=p.sub??p.c;
  app.innerHTML=`<div class="proj"><h1>${esc(p.t)}</h1>
    ${sub?`<div class="meta">${esc(sub)}</div>`:''}
    <div class="gallery ${p.g==='crop'?'crop':'nat'}">${ph.map((k,j)=>`<button data-j="${j}" class="${(j===0&&!p.flat)||(p.g==='race'&&(ar[k-1]||1)>1.3)?'hero':''}" aria-label="Open photo ${j+1}"><img loading="lazy" decoding="async" src="${src(p,k)}" srcset="${src(p,k,1)} 900w, ${src(p,k)} 2600w" sizes="(max-width:34rem) 100vw, ${j===0&&!p.flat?'100vw':p.g==='race'&&(ar[k-1]||1)>1?'50vw':'33vw'}" alt="${esc(p.t)}, photo ${j+1}"${j===0&&!p.flat&&(p.hpos||!p.hero)?` style="object-position:${p.hpos||p.pos||'50% 55%'}"`:p.g!=='crop'&&(j>0||p.flat)?` style="aspect-ratio:${ar[k-1]||1}"`:''}></button>`).join('')}${p.vid?`<div class="vid"><video controls playsinline muted loop preload="none" poster="${p.vid}.jpg"><source src="${p.vid}.mp4" type="video/mp4"></video></div>`:''}</div>
    <div class="pager"><a href="#${prev.s}">← ${esc(prev.t)}</a><a href="#${next.s}">${esc(next.t)} →</a></div></div>`;
}
function contact(){
  app.innerHTML=`<h1>Contact<span>.</span></h1><div class="contact">
    <p>For shoots, prints or collaborations, get in touch.</p>
    <p><span style="color:var(--mute)">Email</span><br><a href="mailto:diazkbiju153@gmail.com" style="font-size:clamp(20px,3vw,28px);font-weight:600;border-bottom:2px solid var(--acc)">diazkbiju153@gmail.com</a></p>
    <p><span style="color:var(--mute)">Instagram</span><br><a href="https://www.instagram.com/the.torpador/" target="_blank" rel="noopener" style="font-size:clamp(20px,3vw,28px);font-weight:600;border-bottom:2px solid var(--acc)">@the.torpador</a></p></div>`;
}
let iRaf=0,dCur=0,dTimer=0;
function intro(){
  document.body.classList.add('intro');
  app.innerHTML=`<section id="intro" aria-label="Featured work">
    <div class="num" id="dN"></div>
    <div class="deck">${P.map((p,i)=>`<div class="cd" data-i="${i}"><img src="${src(p,p.cover,1)}" alt="${esc(p.t)}" style="object-position:${p.pos||'50% 50%'}"></div>`).join('')}</div>
    <div class="dm"><h1 id="dT"></h1><p id="dS"></p><a class="go" id="dGo" href="#">View project →</a></div>
    <div class="arr"><button id="dP" aria-label="Previous project">←</button><button id="dX" aria-label="Next project">→</button></div>
    <p class="hint">Scroll for all work<b>↓</b></p></section>${gridHTML()}`;
  const N=P.length,mod=n=>((n%N)+N)%N,root=document.getElementById('intro'),cards=[...root.querySelectorAll('.cd')];
  const W=()=>innerWidth<700?innerWidth*.52:Math.min(innerWidth*.3,360);
  function draw(){
    const w=W();
    cards.forEach((c,i)=>{const d=mod(i-dCur),k=d>N/2?d-N:d;
      c.style.transform=`translate(${-w*.5-k*w*.11}px,${-w*.62-k*w*.085}px) scale(${1-Math.abs(k)*.045})`;
      c.style.zIndex=50-Math.abs(k);c.style.opacity=Math.abs(k)>4?0:1;
      c.style.filter=k===0?'none':'saturate(.6) brightness(.8)';});
    const p=P[dCur];
    document.getElementById('dS').textContent=p.c;const h=document.getElementById('dT');h.textContent=p.t;fit(h);document.getElementById('dS').textContent=p.c;
    document.getElementById('dGo').href='#'+p.s;document.getElementById('dN').textContent=String(dCur+1).padStart(2,'0');
  }
  let fitSize=0;
  function fit(h){if(!fitSize){const box=h.parentElement.clientWidth,keep=h.textContent;let f=innerWidth<700?56:Math.min(110,innerWidth*.075);for(const p of P){h.textContent=p.t;h.style.fontSize=f+'px';while(h.scrollWidth>box&&f>18){f-=2;h.style.fontSize=f+'px'}}fitSize=f;h.textContent=keep}h.style.fontSize=fitSize+'px'}
  const step=s=>{dCur=mod(dCur+s);draw();restart()};
  function restart(){clearInterval(dTimer);if(!matchMedia('(prefers-reduced-motion: reduce)').matches)dTimer=setInterval(()=>{if(document.getElementById('intro')&&scrollY<innerHeight*.5){dCur=mod(dCur+1);draw()}},5000)}
  root.querySelector('.deck').addEventListener('click',e=>{const c=e.target.closest('.cd');if(!c)return;const i=+c.dataset.i;if(i===dCur)location.hash=P[i].s;else{dCur=i;draw();restart()}});
  document.getElementById('dP').onclick=()=>step(-1);document.getElementById('dX').onclick=()=>step(1);
  let tx=null;root.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
  root.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>40)step(d<0?1:-1);tx=null});
  let wl=0;root.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)<=Math.abs(e.deltaY)||Math.abs(e.deltaX)<4)return;e.preventDefault();const t=Date.now();if(t-wl<450)return;wl=t;step(e.deltaX>0?1:-1)},{passive:false});
  root._step=step;root._fit0=()=>{fitSize=0};draw();restart();
}
addEventListener('keydown',e=>{const r=document.getElementById('intro');if(!r||document.getElementById('lb').classList.contains('open'))return;
  if(e.key==='ArrowRight')r._step(1);if(e.key==='ArrowLeft')r._step(-1)});
addEventListener('resize',()=>{const r=document.getElementById('intro');if(r){r._fit0&&r._fit0();r._step(0)}});
function route(){
  clearInterval(dTimer);document.body.classList.remove('intro');
  const h=location.hash.slice(1);
  const p=P.find(x=>x.s===h);
  if(h==='contact')contact();else if(p)project(p);else if(h==='work'){intro();requestAnimationFrame(()=>{const g=document.querySelector('.grid');if(g)scrollTo(0,g.getBoundingClientRect().top+scrollY-90)});}else intro();
  document.getElementById('n-work').classList.toggle('on',h==='work'||!!p);
  document.getElementById('n-contact').classList.toggle('on',h==='contact');
  document.title=p?`${p.t} | DIAZ K BIJU`:h==='contact'?'Contact | DIAZ K BIJU':h==='work'?'Work | DIAZ K BIJU':'DIAZ K BIJU';
  closeLb();if(h!=='work')window.scrollTo(0,0);
}
const lb=document.getElementById('lb'),lbi=document.getElementById('lbi'),lbc=document.getElementById('lbc');
function show(j){idx=(j+cur.n)%cur.n;const k=cur.order[idx];lbi.src=src(cur,k);lbi.alt=`${cur.t}, photo ${idx+1}`;lbc.textContent=`${cur.t} · ${idx+1} / ${cur.n}`}
function openLb(k){show(k);lb.classList.add('open');document.body.style.overflow='hidden';document.getElementById('lbx').focus()}
function closeLb(){lb.classList.remove('open');document.body.style.overflow=''}
app.addEventListener('click',e=>{const b=e.target.closest('button[data-j]');if(b)openLb(+b.dataset.j)});
document.getElementById('lbx').onclick=closeLb;
document.getElementById('lbp').onclick=()=>show(idx-1);
document.getElementById('lbn').onclick=()=>show(idx+1);
lb.addEventListener('click',e=>{if(e.target===lb||e.target.classList.contains('stage'))closeLb()});
document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')show(idx-1);if(e.key==='ArrowRight')show(idx+1)});
let sx=0;lb.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
lb.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)show(idx+(d<0?1:-1))});
document.getElementById('totop').onclick=e=>{e.preventDefault();window.scrollTo({top:0,behavior:'smooth'})};
addEventListener('hashchange',route);route();
}
</script>
</body>
</html>
